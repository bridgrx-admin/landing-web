version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@10.6.3 --activate
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile --store-dir .pnpm-store
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .pnpm-store/**/*
